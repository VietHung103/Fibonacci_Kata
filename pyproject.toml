[project]
name = "fibonacci-tdd-kata-viethung103"
version = "0.1.0"
description = "A TDD Kata: Fibonacci, from notebook exploration to a tested, pubilshed package"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "viethung", email = "viethungpc103@gmail.com"}]

[project.scripts]
fibonacci-tdd-kata = "fibonacci_tdd_kata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fibonacci_tdd_kata"]

[dependency-groups]
dev = [
    "marimo>=0.10",
    "pytest>=8.0",
    "ruff>=0.6",
    "pytest-cov>=5.0",
    "mypy>=2.4.0",
    "matplotlib>=3.11.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # pyflakes, pycodestyle, isort, pyupgrade, bugbear

[tool.mypy]
strict = true
files = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff.lint.per-file-ignores]
# marimo cells intentionally end on a bare expression to define what the
# cell displays — that pattern is exactly what flake8-bugbear's B018
# ("useless expression") flags, so it's disabled for notebook files.
"notebooks/*.py" = ["B018"]


